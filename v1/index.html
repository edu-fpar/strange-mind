<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Strange Mind v1</title>
  <meta name="description" content="Des formes qui sont des volumes, des animaux qui sont des nombres : un univers pour initier les enfants aux rotations, aux nombres complexes, aux matrices et à l'algèbre géométrique.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ================= MENU ================= -->
  <section id="menu" class="screen" hidden>
    <header class="menu-head">
      <h1><span class="logo">🟪🔺🛑</span> Strange Mind <small style="font-size:.4em;opacity:.6">v1</small></h1>
      <p class="tagline">Les formes cachent des secrets… et les animaux sont des nombres !</p>
    </header>
    <div id="levels" class="levels"></div>
    <div class="menu-actions">
      <button id="btn-sandbox" class="btn">🧪 Bac à sable</button>
      <button id="btn-help" class="btn">🖐️ Comment jouer</button>
    </div>
    <details class="settings">
      <summary>⚙️ Réglages (pour les grands)</summary>
      <label><input type="checkbox" id="opt-voice"> 🔊 Lire les consignes à voix haute</label>
      <label><input type="checkbox" id="opt-sound"> 🎵 Petits sons</label>
      <label><input type="checkbox" id="opt-onefinger"> ☝️ Un seul doigt suffit pour basculer (écran tactile)</label>
      <label><input type="checkbox" id="opt-invert"> ↕️ Inverser le sens du pavé tactile</label>
    </details>
  </section>

  <!-- ================= JEU ================= -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <button id="btn-home" class="icon-btn" title="Menu">🏠</button>
      <h2 id="level-title"></h2>
      <div class="tools">
        <button id="btn-speak" class="icon-btn" title="Réécouter">🔊</button>
        <button id="btn-hint" class="icon-btn" title="Un indice">💡</button>
        <button id="btn-reset" class="icon-btn" title="Recommencer l'étape">🔄</button>
        <button id="btn-guide" class="icon-btn" title="Pour les grands : la notion mathématique">🎓</button>
      </div>
    </header>
    <div class="bubble">
      <span class="mascot">🦉</span>
      <div><p id="say"></p><div id="stepdots"></div></div>
    </div>
    <div class="play">
      <div id="stage"></div>
      <div id="panels"></div>
    </div>
  </section>

  <div id="modal" hidden>
    <div class="modal-card">
      <button class="modal-close icon-btn" title="Fermer">✖</button>
      <div class="modal-body"></div>
    </div>
  </div>

  <template id="help-template">
    <h2>🖐️ Comment jouer</h2>
    <table class="help">
      <tr><th></th><th>Basculer la forme<br><small>(voir une autre face)</small></th><th>Tourner la face<br><small>(le dessin tourne)</small></th></tr>
      <tr><td>📱 Écran tactile</td><td>glisser avec 2 doigts (ou 1)</td><td>tourner 2 doigts comme une clé, ou ↺ ↻</td></tr>
      <tr><td>💻 Pavé tactile</td><td>défiler avec 2 doigts sur la forme</td><td>pincer, Maj + défiler, ou ↺ ↻</td></tr>
      <tr><td>🖱️ Souris</td><td>cliquer-glisser</td><td>clic droit glissé, Maj + glisser, ou ↺ ↻</td></tr>
      <tr><td>⌨️ Clavier</td><td>flèches</td><td>Q (↺) et E (↻)</td></tr>
    </table>
    <p>Les boutons 🎓 dans chaque niveau expliquent aux adultes la notion mathématique cachée.</p>
  </template>

  <canvas id="confetti"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
